<body>

    <input type="file" id="input" onpaste="Test_">
    <div id="twoinput"></div>
    <div id="output_upload", style="margin: 10px;"></div>

    <script type="py" config="{}">
        import pyscript
        from pyscript import when
        import pyodide_js
        await pyodide_js.loadPackage('pillow')
        from PIL import Image, ImageFilter
        import os, re
        from js import document, console, window, Uint8Array, File, navigator
        import pyodide, asyncio, io

        async def _upload_change_and_show(e):
            # print(e)
            #Get the first file from upload
            file_list = e.target.files
            first_item = file_list.item(0)

            #Get the data from the files arrayBuffer as an array of unsigned bytes
            array_buf = Uint8Array.new(await first_item.arrayBuffer())

            #BytesIO wants a bytes-like object, so convert to bytearray first
            bytes_list = bytearray(array_buf)
            my_bytes = io.BytesIO(bytes_list) 

            #Create PIL image from np array
            my_image = Image.open(my_bytes)

            #Log some of the image data for testing
            console.log(f"{my_image.format= } {my_image.width= } {my_image.height= }")

            # Now that we have the image loaded with PIL, we can use all the tools it makes available. 
            # "Emboss" the image, rotate 45 degrees, fill with dark green
            my_image = Process(my_image, (0,0,0), (255, 170, 33))

            #Convert Pillow object array back into File type that createObjectURL will take
            my_stream = io.BytesIO()
            my_image.save(my_stream, format="PNG")

            #Create a JS File object with our data and the proper mime type
            image_file = File.new([Uint8Array.new(my_stream.getvalue())], "new_image_file.png", {type: "image/png"})

            #Create new tag and insert into page
            new_image = document.createElement('img')
            new_image.src = window.URL.createObjectURL(image_file)
            document.getElementById("output_upload").replaceChildren(new_image)
        
        async def _upload_change_and_show_paste(e):
            # print(e)
            #Get the first file from upload
            first_item = e.detail.files

            #Get the data from the files arrayBuffer as an array of unsigned bytes
            array_buf = Uint8Array.new(await first_item.arrayBuffer())

            #BytesIO wants a bytes-like object, so convert to bytearray first
            bytes_list = bytearray(array_buf)
            my_bytes = io.BytesIO(bytes_list) 

            #Create PIL image from np array
            my_image = Image.open(my_bytes)

            #Log some of the image data for testing
            console.log(f"{my_image.format= } {my_image.width= } {my_image.height= }")

            # Now that we have the image loaded with PIL, we can use all the tools it makes available. 
            # "Emboss" the image, rotate 45 degrees, fill with dark green
            my_image = Process(my_image, (0,0,0), (255, 170, 33))

            #Convert Pillow object array back into File type that createObjectURL will take
            my_stream = io.BytesIO()
            my_image.save(my_stream, format="PNG")

            #Create a JS File object with our data and the proper mime type
            image_file = File.new([Uint8Array.new(my_stream.getvalue())], "new_image_file.png", {type: "image/png"})

            #Create new tag and insert into page
            new_image = document.createElement('img')
            new_image.src = window.URL.createObjectURL(image_file)
            document.getElementById("output_upload").replaceChildren(new_image)
        
        upload_file = pyodide.ffi.create_proxy(_upload_change_and_show)
        document.getElementById("input").addEventListener("change", upload_file)
        upload_file = pyodide.ffi.create_proxy(_upload_change_and_show_paste)
        document.getElementById("twoinput").addEventListener("change", upload_file)

        # document.addEventListener('paste',pyodide.ffi.create_proxy(handleClipboard))

        def Process(pic, color_A= (0,0,0), color_B= (255, 255, 255)):
            if pic.mode != "RGBA":
                pic= pic.convert("RGBA")
            pix=pic.load()
            for x in range(pic.size[0]):
                for y in range(pic.size[1]):
                    r,g,b,a= pix[x,y]
                    col_A= (color_A[0],color_A[1],color_A[2],a)
                    col_B= (color_B[0],color_B[1],color_B[2],a)
                    pix[x,y]= IntList(tuple(Lerp(col_A, col_B, ((sum(pix[x,y])-a)/(3*255)))))    
            return pic
        def Lerp(a: tuple|list|int|float, b: tuple|list|int|float, i: float):
            if type(a)== int or type(a)== float:
                if type(b)==int or type(b)== float:
                    return (1-i)*a+i*b
                else:
                    RetVal=[]
                    for n in range(len(b)):
                        RetVal.append(Lerp(b[n],a,i))
                    return RetVal

            else:
                if type(b)== tuple or type(b)== list:
                    if len(a)==len(b):
                        RetVal=[]
                        for n in range(len(a)):
                            RetVal.append(Lerp(a[n],b[n],i))
                        return RetVal
                else:
                    RetVal=[]
                    for n in range(len(a)):
                        RetVal.append(Lerp(a[n],b,i))
                    return RetVal
        def IntList(inp:tuple|list):
            Ret=[]
            for i in inp:
                Ret.append(int(i))
            if type(inp)==tuple: Ret= tuple(Ret)
            return Ret


    </script>
