        def Process(pic, color_B= (255, 255, 255)):
            if pic.mode != "RGBA":
                pic= pic.convert("RGBA")

            im= numpy.asarray(pic)
            alpha= im[:,:,-1]
            im= numpy.sum(im,axis=2,keepdims=True)/(im.shape[2]*255)
            im= color_B*im
            im= numpy.append(im,numpy.reshape(alpha,(im.shape[0], im.shape[1], 1)),2)

            return Image.fromarray(numpy.uint8(im))

    <script>
        let Sample_A= document.getElementById("Sample_A");
        cont= Sample_A.getContext('2d');
        R=document.getElementsByName('Red')[0];
        G=document.getElementsByName('Green')[0];
        B=document.getElementsByName('Blue')[0];
        Preset=document.getElementById('color');
        const Colors= {
            'Orange':[255, 170, 33],
            'Yellow':[255,255,0],
            'Green':[0,255,0],
            'Blue':[0,0,255],
            'Purple':[255,0,255],
            'Red':[255,0,0]
        }

        function UpdateColorSample(){
            Color="#"+AsHex(R.value)+AsHex(G.value)+AsHex(B.value);
            // console.log(Color);
            cont.fillStyle=Color;
            cont.fillRect(0,0,50,50);
        }
        
        Choice=Colors['Orange'];
        // console.log(Choice);
        R.value=Choice[0];
        G.value=Choice[1];
        B.value=Choice[2];
        UpdateColorSample();

        function AsHex(Val){
            if (Val==0){
                return "00"
            }
            return Number(Val).toString(16);
        }

        R.addEventListener('change',UpdateColorSample);
        G.addEventListener('change',UpdateColorSample);
        B.addEventListener('change',UpdateColorSample);

        Preset.addEventListener('change',(event)=>{
            Choice=Colors[Preset.value];
            console.log(Choice);
            R.value=Choice[0];
            G.value=Choice[1];
            B.value=Choice[2];
            R.dispatchEvent(new Event('change'));
            G.dispatchEvent(new Event('change'));
            B.dispatchEvent(new Event('change'));
        })

        document.addEventListener('paste',(event)=>{
            In= document.getElementById('twoinput');
            In.value= event.clipboardData.files[0];
            In.dispatchEvent(new CustomEvent('change',{detail:{files: In.value}}))
            console.log(In.value)
